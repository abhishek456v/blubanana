project_id = "bbdvgeavtxfxykhiafbp"

# send-due-reminders is invoked by pg_cron, which has no user session and so
# sends no Authorization header. Left at the default, the gateway rejects it
# with UNAUTHORIZED_NO_AUTH_HEADER before the function runs. The function is
# not left unprotected: it authenticates on the CRON_SECRET shared secret
# instead (see the top of its index.ts), which is the whole reason that secret
# exists.
#
# extract-deal and transcribe-audio are deliberately absent here. Those are
# called by the app with a signed-in user's JWT and must keep verifying it.
[functions.send-due-reminders]
verify_jwt = false

# The Instagram OAuth redirect. Meta sends a browser here with no session at
# all, so a JWT check would reject the callback before it ran. Its security is
# the single-use `state` nonce from 033, which ties the callback to the
# workspace that started the flow.
[functions.social-oauth]
verify_jwt = false

# Called by pg_cron for the nightly pass, which has no session either. It
# authenticates every request itself — the CRON_SECRET for a full sync, or a
# real user JWT resolved through getUser() and scoped to that caller's
# workspaces for a single-account refresh.
[functions.social-sync]
verify_jwt = false
